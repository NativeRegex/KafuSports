<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Record Results')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card">
        <h1>📝 Record Match Results</h1>
        <p style="margin: 15px 0 30px; color: #8b949e;">
            Enter the score for a scheduled fixture. Teams' points update automatically.
        </p>

        <form th:action="@{/admin/results/add}" method="post"
              style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; align-items: center;">
            <select name="fixtureId" required
                    style="padding: 12px; background: #0D1117; border: 1px solid #30363D; color: white; border-radius: 5px; flex: 1;">
                <option value="">Select a fixture...</option>
                <option th:each="f : ${fixtures}" th:value="${f.id}"
                        th:text="${f.homeTeam.name} + ' vs ' + ${f.awayTeam.name} + ' (' + ${#temporals.format(f.matchDate, 'dd MMM')} + ')'">
                </option>
            </select>
            <input type="number" name="homeScore" min="0" placeholder="Home" required
                   style="width: 90px; padding: 12px; background: #0D1117; border: 1px solid #30363D; color: white; border-radius: 5px;">
            <input type="number" name="awayScore" min="0" placeholder="Away" required
                   style="width: 90px; padding: 12px; background: #0D1117; border: 1px solid #30363D; color: white; border-radius: 5px;">
            <button type="submit" class="btn">Save Result</button>
        </form>

        <h2>Recorded Results</h2>
        <table style="margin-top: 20px;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Home</th>
                    <th>Score</th>
                    <th>Away</th>
                    <th>Venue</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${results}">
                    <td th:text="${#temporals.format(r.matchDate, 'dd MMM yyyy')}">Date</td>
                    <td th:text="${r.homeTeam.name}">Home</td>
                    <td style="font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #FFC107;"
                        th:text="${r.homeScore} + ' - ' + ${r.awayScore}">0 - 0</td>
                    <td th:text="${r.awayTeam.name}">Away</td>
                    <td th:text="${r.venue}">Venue</td>
                    <td style="text-align: right;">
                        <a th:href="@{/admin/results/delete/{id}(id=${r.id})}"
                           style="color: #ff7b72; text-decoration: none;"
                           onclick="return confirm('Delete this result?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="6" style="text-align: center; padding: 40px; color: #8b949e;">No results yet.</td>
                </tr>
            </tbody>
        </table>

        <p style="margin-top: 30px;"><a th:href="@{/admin}" style="color: #00FF88;">← Back to Admin</a></p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
