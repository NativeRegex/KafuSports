<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('League Table')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card">
        <div class="icon-title"><svg th:replace="~{fragments/icons :: trophy}" class="icon icon-lg"></svg><h1 style="margin:0;">KAFU League Table</h1></div>
        <p style="margin: 15px 0 30px; color: #8b949e;">
            Sorted by points, then goal difference.
        </p>

        <div style="overflow-x: auto;">
        <table style="min-width: 800px;">
            <thead>
                <tr>
                    <th style="text-align: left;">Pos</th>
                    <th style="text-align: left;">Team</th>
                    <th style="text-align: center;">P</th>
                    <th style="text-align: center;">W</th>
                    <th style="text-align: center;">D</th>
                    <th style="text-align: center;">L</th>
                    <th style="text-align: center;">GF</th>
                    <th style="text-align: center;">GA</th>
                    <th style="text-align: center;">GD</th>
                    <th style="text-align: center;">Pts</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="team, iter : ${teams}">
                    <td style="font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #00FF85;"
                        th:text="${iter.count}">1</td>
                    <td>
                        <a th:href="@{/teams/{id}(id=${team.id})}"
                           style="font-weight: 600; color: #FFFFFF; text-decoration: none;"
                           th:text="${team.name}">Team</a>
                    </td>
                    <td style="text-align: center;" th:text="${team.played}">0</td>
                    <td style="text-align: center; color: #00FF85;" th:text="${team.wins}">0</td>
                    <td style="text-align: center; color: #FFC107;" th:text="${team.draws}">0</td>
                    <td style="text-align: center; color: #ff7b72;" th:text="${team.losses}">0</td>
                    <td style="text-align: center; color: #8b949e;" th:text="${team.goalsFor}">0</td>
                    <td style="text-align: center; color: #8b949e;" th:text="${team.goalsAgainst}">0</td>
                    <td style="text-align: center; font-weight: bold;"
                        th:style="${team.goalDifference > 0} ? 'color: #00FF85;' : (${team.goalDifference < 0} ? 'color: #ff7b72;' : 'color: #C9D1D9;')"
                        th:text="${team.goalDifference > 0} ? '+' + ${team.goalDifference} : ${team.goalDifference}">0</td>
                    <td style="text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #FFC107;"
                        th:text="${team.points}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(teams)}">
                    <td colspan="10" style="text-align: center; padding: 40px; color: #8b949e;">No teams yet.</td>
                </tr>
            </tbody>
        </table>
        </div>

        <p style="margin-top: 20px; color: #8b949e; font-size: 13px;">
            <strong>Legend:</strong> P = Played · W = Won · D = Drawn · L = Lost · 
            GF = Goals For · GA = Goals Against · GD = Goal Difference · Pts = Points
        </p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
