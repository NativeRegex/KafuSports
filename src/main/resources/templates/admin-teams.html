<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Teams')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card">
        <h1 style="color: #00FF88; margin-bottom: 20px;">Manage Teams</h1>
        <p style="margin-bottom: 30px;">Add teams to the KAFU League.</p>

        <form th:action="@{/admin/teams/add}" th:object="${newTeam}" method="post" style="display: flex; gap: 10px; margin-bottom: 30px;">
            <input type="text" th:field="*{name}" placeholder="Team Name (e.g., Sharks FC)" required
                   style="flex: 1; padding: 12px; background: #0D1117; border: 1px solid #30363D; color: white; border-radius: 5px;">
            <input type="text" th:field="*{sport}" placeholder="Sport (e.g., Men's Football)" value="Men's Football" required
                   style="flex: 1; padding: 12px; background: #0D1117; border: 1px solid #30363D; color: white; border-radius: 5px;">
            <button type="submit" class="btn">Add Team</button>
        </form>

        <h2 style="color: #00FF88; margin-bottom: 20px;">Teams (<span th:text="${#lists.size(teams)}">0</span>)</h2>
        <table style="width: 100%; border-collapse: collapse; background: #0D1117; border-radius: 8px;">
            <thead style="background: #161B22;">
                <tr>
                    <th style="padding: 15px; text-align: left; color: #00FF88;">Team</th>
                    <th style="padding: 15px; text-align: left; color: #00FF88;">Sport</th>
                    <th style="padding: 15px; text-align: center; color: #00FF88;">W</th>
                    <th style="padding: 15px; text-align: center; color: #00FF88;">D</th>
                    <th style="padding: 15px; text-align: center; color: #00FF88;">L</th>
                    <th style="padding: 15px; text-align: center; color: #00FF88;">Pts</th>
                    <th style="padding: 15px; text-align: right; color: #00FF88;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="team : ${teams}" style="border-top: 1px solid #30363D;">
                    <td style="padding: 15px;" th:text="${team.name}">Team</td>
                    <td style="padding: 15px;" th:text="${team.sport}">Sport</td>
                    <td style="padding: 15px; text-align: center;" th:text="${team.wins}">0</td>
                    <td style="padding: 15px; text-align: center;" th:text="${team.draws}">0</td>
                    <td style="padding: 15px; text-align: center;" th:text="${team.losses}">0</td>
                    <td style="padding: 15px; text-align: center; font-weight: bold; color: #00FF88;" th:text="${team.points}">0</td>
                    <td style="padding: 15px; text-align: right;">
                        <a th:href="@{/admin/teams/delete/{id}(id=${team.id})}" style="color: #ff7b72; text-decoration: none;" onclick="return confirm('Delete this team?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(teams)}">
                    <td colspan="7" style="padding: 30px; text-align: center; color: #8b949e;">No teams yet. Add your first team above!</td>
                </tr>
            </tbody>
        </table>

        <p style="margin-top: 30px;"><a th:href="@{/admin}" style="color: #00FF88;">← Back to Admin</a></p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
