<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title} + ' | KAFU Sports'">KAFU Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        html {
            background: #0A0E14 url('/images/kafuu.png') no-repeat center center fixed;
            background-size: cover;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        

        body { font-family: 'Inter', sans-serif; background: transparent; color: #F9FAFB; min-height: 100vh; }

        /* ---------- Nav ---------- */
        .navbar {
            background: rgba(10, 14, 20, 0.95);
            backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(26, 92, 56, 0.4);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            display: flex; align-items: center; gap: 15px;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            letter-spacing: 2px;
            color: #C9A227;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .navbar-brand img { height: 50px; width: auto; filter: drop-shadow(0 0 8px rgba(201, 162, 39, 0.5)); }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            color: #C9D1D9; text-decoration: none;
            font-weight: 600; font-size: 14px;
            letter-spacing: 1px; text-transform: uppercase;
            position: relative; transition: color 0.2s;
        }
        .nav-links a::after {
            content: ''; position: absolute;
            bottom: -6px; left: 0; right: 0;
            height: 2px; background: #1A5C38;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        .nav-links a:hover { color: #C9A227; }
        .nav-links a:hover::after { transform: scaleX(1); }

        /* ---------- Container ---------- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            animation: fadeUp 0.6s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Cards ---------- */
        .card {
            background: linear-gradient(145deg, rgba(10, 20, 15, 0.85), rgba(8, 16, 12, 0.85));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(77, 208, 134, 0.35);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(26, 92, 56, 0.15), inset 0 0 40px rgba(0, 255, 136, 0.02);
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.15);
        }

        /* ---------- Buttons ---------- */
        .btn {
            background: #1A5C38;
            color: #0A0E14;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #B4FFD4;
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.7);
        }

        /* ---------- Headings ---------- */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            letter-spacing: 3px;
            color: #C9A227;
            text-shadow: 0 0 25px rgba(201, 162, 39, 0.4);
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 2px;
            color: #FFFFFF;
        }

        /* ---------- Tables ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 14, 20, 0.7);
            border-radius: 8px;
            overflow: hidden;
        }
        thead {
            background: linear-gradient(90deg, rgba(0,255,136,0.15), rgba(255,193,7,0.08));
        }
        th {
            padding: 15px;
            text-align: left;
            color: #C9A227;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            letter-spacing: 1.5px;
        }
        tbody tr {
            border-top: 1px solid rgba(0, 255, 136, 0.1);
            transition: background 0.2s ease;
        }
        tbody tr:hover { background: rgba(0, 255, 136, 0.06); }
        td { padding: 15px; color: #C9D1D9; }

        /* Row reveal animation */
        tbody tr { animation: rowIn 0.4s ease both; }
        tbody tr:nth-child(1)  { animation-delay: 0.02s; }
        tbody tr:nth-child(2)  { animation-delay: 0.06s; }
        tbody tr:nth-child(3)  { animation-delay: 0.10s; }
        tbody tr:nth-child(4)  { animation-delay: 0.14s; }
        tbody tr:nth-child(5)  { animation-delay: 0.18s; }
        tbody tr:nth-child(6)  { animation-delay: 0.22s; }
        tbody tr:nth-child(7)  { animation-delay: 0.26s; }
        tbody tr:nth-child(8)  { animation-delay: 0.30s; }
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #5a6673;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        
        /* ---- Sporty badge & wordmark ---- */
        .navbar-brand {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            letter-spacing: 3px;
        }
        .navbar-brand .badge {
            width: 42px; height: 42px;
            filter: drop-shadow(0 0 12px rgba(201, 162, 39, 0.6));
            transition: transform 0.3s ease;
        }
        .navbar-brand:hover .badge { transform: rotate(-6deg) scale(1.08); }
        .navbar-brand .brand-text {
            font-size: 28px;
            color: #FFFFFF;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .navbar-brand .brand-accent { color: #C9A227; }
        @keyframes neonPulse {
            0%, 100% { text-shadow: 0 0 18px rgba(0, 255, 133, 0.85); }
            50%      { text-shadow: 0 0 30px rgba(0, 255, 133, 1), 0 0 45px rgba(0, 255, 133, 0.6); }
        }


        /* ---- Inline SVG icons ---- */
        .icon {
            width: 28px; height: 28px;
            vertical-align: middle;
            display: inline-block;
        }
        .icon-lg { width: 64px; height: 64px; }
        .icon-title {
            display: inline-flex; align-items: center; gap: 12px;
        }

/* ---------- Mobile ---------- */
        @media (max-width: 768px) {
            .navbar { padding: 12px 20px; }
            .navbar-brand { font-size: 22px; }
            .navbar-brand img { height: 36px; }
            .nav-links { gap: 15px; }
            .nav-links a { font-size: 11px; }
            h1 { font-size: 36px; }
        }
    
        


        


        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 20, 15, 0.55);
            z-index: -1;
            pointer-events: none;
        }


        /* =========================================================
           LIVE / ANIMATED TEXT & CARDS
           ========================================================= */

        /* 1. Gradient flowing text — for big headings */
        .live-heading {
            background: linear-gradient(90deg, #FFFFFF 0%, #4DD086 25%, #C9A227 50%, #4DD086 75%, #FFFFFF 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 6s linear infinite;
        }
        @keyframes gradientFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 2. Typewriter effect for subtitles */
        .typewriter {
            overflow: hidden;
            border-right: 2px solid #4DD086;
            white-space: nowrap;
            animation: typing 4s steps(60, end), blinkCursor 0.9s step-end infinite alternate;
            max-width: fit-content;
            margin: 0 auto;
        }
        @keyframes typing {
            from { width: 0; }
            to   { width: 100%; }
        }
        @keyframes blinkCursor {
            50% { border-color: transparent; }
        }

        /* 3. Breathing cards — subtle float */
        .live-card {
            animation: floatCard 6s ease-in-out infinite;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        /* Stagger so they don't move in sync */
        .live-card:nth-child(2) { animation-delay: 1s; }
        .live-card:nth-child(3) { animation-delay: 2s; }
        .live-card:nth-child(4) { animation-delay: 3s; }

        /* 4. Glowing buttons */
        .btn-live {
            animation: btnPulse 2.4s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(77, 208, 134, 0.4); }
            50%      { box-shadow: 0 0 35px rgba(77, 208, 134, 0.9), 0 0 55px rgba(201, 162, 39, 0.4); }
        }

        /* 5. Fade-in-up on page load */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpIn 0.8s ease forwards;
        }
        .fade-up.delay-1 { animation-delay: 0.2s; }
        .fade-up.delay-2 { animation-delay: 0.4s; }
        .fade-up.delay-3 { animation-delay: 0.6s; }
        @keyframes fadeUpIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 6. Neon underline on nav links (already there, but brighter) */
        .nav-links a:hover {
            color: #4DD086;
            text-shadow: 0 0 12px rgba(77, 208, 134, 0.9);
        }

        /* 7. Live number count-up effect uses JS, styling only here */
        .live-number {
            font-variant-numeric: tabular-nums;
        }

        /* 8. Live dot indicator for "LIVE" labels */
        .live-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #FF4D4D;
            margin-right: 8px;
            box-shadow: 0 0 10px #FF4D4D;
            animation: livePulse 1.2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(1.3); }
        }

</style>
</head>
<body>

<nav th:fragment="navbar" class="navbar">
    <a class="navbar-brand" th:href="@{/}">
        <img class="badge" th:src="@{/images/kafu-logo.png}" alt="KAFU"/>
        <span class="brand-text">
            KAFU <span class="brand-accent">SPORTS</span>
        </span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/league}">League</a>
        <a th:href="@{/fixtures}">Fixtures</a>
        <a th:href="@{/results}">Results</a>
        <a th:href="@{/teams}">Teams</a>
        <a th:href="@{/players}">Players</a>
        <a th:href="@{/stats}">Stats</a>
        <a th:href="@{/login}">Admin</a>
    </div>
</nav>

<footer th:fragment="footer">
    © 2026 Kaimosi Friends University Sports Portal · Built by Calistus Sirucha
</footer>
</body>
</html>
