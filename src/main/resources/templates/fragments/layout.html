<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | KAFU Sports'">KAFU Sports</title>
    <meta name="google-site-verification" content="ez9Z8rhJeB1a29kA-eWJc7QHqTOYERodRd9MdNSa0nE" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ---------- Base ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            background: #0A0E14 url('/images/kafuu.png') no-repeat center center fixed;
            background-size: cover;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #F9FAFB;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 20, 15, 0.55);
            z-index: -1;
            pointer-events: none;
        }

        /* ---------- Navbar ---------- */
        .navbar {
            background: rgba(10, 14, 20, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(26, 92, 56, 0.4);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            letter-spacing: 3px;
        }

        .navbar-brand .badge {
            width: 42px;
            height: 42px;
            filter: drop-shadow(0 0 12px rgba(201, 162, 39, 0.6));
            transition: transform 0.3s ease;
        }
        .navbar-brand:hover .badge { transform: rotate(-6deg) scale(1.08); }

        .navbar-brand .brand-text {
            font-size: 28px;
            color: #FFFFFF;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .navbar-brand .brand-accent { color: #C9A227; }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            color: #C9D1D9;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.2s;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0; right: 0;
            height: 2px;
            background: #C9A227;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        .nav-links a:hover { color: #C9A227; text-shadow: 0 0 12px rgba(201,162,39,0.9); }
        .nav-links a:hover::after { transform: scaleX(1); }

        /* Hamburger button — hidden on desktop */
        .nav-toggle {
            display: none;
            background: transparent;
            border: 1px solid rgba(201, 162, 39, 0.5);
            color: #C9A227;
            font-size: 22px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: auto;
        }

        /* ---------- Container ---------- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            animation: fadeUp 0.6s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Cards ---------- */
        .card {
            background: linear-gradient(145deg, rgba(10, 20, 15, 0.85), rgba(8, 16, 12, 0.85));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(77, 208, 134, 0.35);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(26, 92, 56, 0.15), inset 0 0 40px rgba(0, 255, 136, 0.02);
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.15);
        }

        /* ---------- Buttons ---------- */
        .btn {
            background: #1A5C38;
            color: #FFFFFF;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(26, 92, 56, 0.6);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #C9A227;
            color: #0A0E14;
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(201, 162, 39, 0.7);
        }

        /* ---------- Headings ---------- */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            letter-spacing: 3px;
            color: #C9A227;
            text-shadow: 0 0 25px rgba(201, 162, 39, 0.4);
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 2px;
            color: #FFFFFF;
        }

        /* ---------- Tables ---------- */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 14, 20, 0.7);
        }
        thead {
            background: linear-gradient(90deg, rgba(26,92,56,0.35), rgba(201,162,39,0.15));
        }
        th {
            padding: 15px;
            text-align: left;
            color: #C9A227;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            letter-spacing: 1.5px;
        }
        tbody tr {
            border-top: 1px solid rgba(77, 208, 134, 0.1);
            transition: background 0.2s ease;
        }
        tbody tr:hover { background: rgba(77, 208, 134, 0.06); }
        td { padding: 15px; color: #C9D1D9; }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #5a6673;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 16px;
                flex-wrap: nowrap;
                position: relative;
            }
            .navbar-brand { font-size: 18px; gap: 8px; }
            .navbar-brand .brand-text { font-size: 18px; }
            .navbar-brand .badge { width: 32px; height: 32px; }

            .nav-toggle { display: block; }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                display: none;
                flex-direction: column;
                gap: 0;
                background: rgba(10, 14, 20, 0.98);
                border-top: 1px solid rgba(201, 162, 39, 0.4);
                border-bottom: 1px solid rgba(201, 162, 39, 0.4);
                padding: 0;
                z-index: 200;
            }
            .nav-links.open { display: flex; }
            .nav-links a {
                padding: 14px 20px;
                font-size: 14px;
                border-bottom: 1px solid rgba(201, 162, 39, 0.15);
                text-align: left;
                width: 100%;
            }
            .nav-links a:last-child { border-bottom: none; }
            .nav-links a::after { display: none; }

            .container {
                margin: 20px auto;
                padding: 0 12px;
            }

            h1 { font-size: 34px !important; letter-spacing: 2px; }
            h2 { font-size: 20px; }
            h3 { font-size: 16px; }

            .card { padding: 20px 16px; }

            table { font-size: 12px; }
            th, td { padding: 8px 6px; white-space: nowrap; }

            .btn { padding: 10px 16px; font-size: 12px; }

            [style*="display: grid"],
            [style*="display:grid"] {
                grid-template-columns: 1fr !important;
            }

            [style*="font-size: 76px"],
            [style*="font-size:76px"],
            [style*="font-size: 60px"],
            [style*="font-size:60px"],
            [style*="font-size: 52px"],
            [style*="font-size:52px"],
            [style*="font-size: 48px"],
            [style*="font-size:48px"] {
                font-size: 32px !important;
                line-height: 1.2 !important;
            }
            [style*="font-size: 36px"],
            [style*="font-size:36px"] {
                font-size: 26px !important;
            }

            [style*="repeat(4, 1fr)"],
            [style*="repeat(3, 1fr)"] {
                grid-template-columns: 1fr 1fr !important;
            }
        }

        @media (max-width: 480px) {
            .navbar-brand .brand-text { font-size: 16px; }
            .navbar-brand .badge { width: 26px; height: 26px; }
            h1 { font-size: 26px !important; }
            h2 { font-size: 17px; }
            .card { padding: 16px 12px; }
            th, td { padding: 6px 4px; font-size: 11px; }
        }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar">
    <a class="navbar-brand" th:href="@{/}">
        <img class="badge" th:src="@{/images/kafu-logo.png}" alt="KAFU"/>
        <span class="brand-text">
            KAFU <span class="brand-accent">SPORTS</span>
        </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <div class="nav-links" id="navLinks">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/league}">League</a>
        <a th:href="@{/fixtures}">Fixtures</a>
        <a th:href="@{/results}">Results</a>
        <a th:href="@{/teams}">Teams</a>
        <a th:href="@{/players}">Players</a>
        <a th:href="@{/stats}">Stats</a>
        <a th:href="@{/login}">Admin</a>
    </div>
</nav>

<footer th:fragment="footer">
    © 2026 Kaimosi Friends University Sports Portal · Built by Calistus Sirucha
    <script>
        (function () {
            var toggle = document.getElementById('navToggle');
            var links  = document.getElementById('navLinks');
            if (!toggle || !links) return;

            toggle.addEventListener('click', function (e) {
                e.preventDefault();
                links.classList.toggle('open');
                toggle.textContent = links.classList.contains('open') ? '✕' : '☰';
            });

            links.querySelectorAll('a').forEach(function (a) {
                a.addEventListener('click', function () {
                    links.classList.remove('open');
                    toggle.textContent = '☰';
                });
            });
        })();
    </script>
</footer>

</body>
</html>
