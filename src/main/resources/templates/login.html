<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 440px; margin-top: 60px;">
    <div class="card" style="text-align: center; padding: 36px 28px;">
        <h2 style="color: #C9A227; margin-bottom: 28px; font-size: 26px;">Admin Login</h2>

        <form class="login-form" th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div th:if="${param.error}" style="margin-top: 20px; padding: 12px; background: rgba(220,53,69,0.2); border: 1px solid rgba(220,53,69,0.5); border-radius: 8px; color: #ff7b72; font-size: 13px;">
            Invalid username or password
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
