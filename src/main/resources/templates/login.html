<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 440px; margin-top: 60px;">
    <div class="card" style="text-align: center; padding: 36px 28px;">
        <h2 style="color: #C9A227; margin-bottom: 28px; font-size: 26px;">Admin Login</h2>

        <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 16px;">
            <input type="text" name="username" placeholder="Username" required
                   style="padding: 14px 16px;
                          background: rgba(255,255,255,0.08);
                          border: 1.5px solid rgba(201,162,39,0.6);
                          border-radius: 8px;
                          color: #FFFFFF;
                          font-size: 15px;
                          font-family: 'Inter', sans-serif;
                          outline: none;">

            <input type="password" name="password" placeholder="Password" required
                   style="padding: 14px 16px;
                          background: rgba(255,255,255,0.08);
                          border: 1.5px solid rgba(201,162,39,0.6);
                          border-radius: 8px;
                          color: #FFFFFF;
                          font-size: 15px;
                          font-family: 'Inter', sans-serif;
                          outline: none;">

            <button type="submit"
                    style="width: 100%;
                           padding: 14px;
                           background: #C9A227;
                           color: #0A0E14;
                           border: none;
                           border-radius: 8px;
                           font-weight: 800;
                           font-size: 14px;
                           letter-spacing: 1.5px;
                           text-transform: uppercase;
                           cursor: pointer;
                           box-shadow: 0 0 20px rgba(201, 162, 39, 0.5);
                           font-family: 'Inter', sans-serif;">
                Login
            </button>
        </form>

        <div th:if="${param.error}"
             style="margin-top: 20px; padding: 12px;
                    background: rgba(220,53,69,0.15);
                    border: 1px solid rgba(220,53,69,0.5);
                    border-radius: 8px;
                    color: #ff7b72; font-size: 13px;">
            Invalid username or password
        </div>

        <div th:if="${param.logout}"
             style="margin-top: 20px; padding: 12px;
                    background: rgba(26,92,56,0.2);
                    border: 1px solid rgba(77,208,134,0.5);
                    border-radius: 8px;
                    color: #4DD086; font-size: 13px;">
            You have been logged out
        </div>

        <p style="margin-top: 24px; color: #8b949e; font-size: 13px;">
            <a th:href="@{/}" style="color: #C9A227; text-decoration: none;">← Back to home</a>
        </p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
